# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 2.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: QuixLakeSinkEventCaller
    application: quixlakesinkeventcaller
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    variables:
      - name: CATALOG_AUTH_TOKEN
        secretKey: catalog_token
      - name: STREAM_FINISHED_CONFIG
        value: '[     {"key":"sensor-a","timeout_ms":10000,"func":"log_finished"},     {"key":"sensor-c","timeout_ms":10000,"func":"log_finished"},     {"key":"sensor-d","timeout_ms":10000,"func":"log_finished"}   ]'
    blobStorage:
      bind: true
  - name: Timeout Test Producer
    application: timeout-test-producer
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 200
      replicas: 1
    desiredStatus: Running
    variables:
      - name: output
        value: timeouted-data
      - name: COMMIT_INTERVAL_MS
        value: 30000

# This section describes the Topics of the data pipeline
topics:
  - name: tsbs_data_transformed
  - name: timeouted-data
